name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard against committed Groq secrets
        run: |
          if grep -RInE --exclude-dir=.git 'gsk_[A-Za-z0-9_-]{20,}' .; then
            echo "Potential Groq API key detected in repository content."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile cyberhelper.py

      - name: Verify runtime imports
        run: python -c "import customtkinter, groq; print('dependencies ok')"

      - name: Verify Groq client surface
        run: |
          python - <<'PY'
          from groq import Groq

          client = Groq(api_key="ci-placeholder-key")
          assert hasattr(client, "chat")
          assert hasattr(client.chat, "completions")
          assert hasattr(client.chat.completions, "create")
          print("Groq chat.completions client surface ok")
          PY

      - name: Import application module
        run: python -c "import cyberhelper; print('application import ok')"
